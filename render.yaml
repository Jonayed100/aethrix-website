# Render Blueprint: creates the website and its PostgreSQL database in one go.
databases:
  - name: aethrix-db
    plan: free
    databaseName: aethrix
    user: aethrix

services:
  - type: web
    name: project-aethrix
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: aethrix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
      - key: CONTACT_EMAIL
        value: projectaethrix@gmail.com
      - key: BOOKING_NOTIFY_EMAIL
        value: projectaethrix@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: Project Aethrix <projectaethrix@gmail.com>
      - key: SITE_URL
        sync: false
      - key: FOUNDER_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: FOUNDER_EMAIL
        sync: false
      - key: FOUNDER_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false