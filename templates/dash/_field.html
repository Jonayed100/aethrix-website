<div class="field{% if f.errors %} has-err{% endif %}">
  <label for="{{ f.id_for_label }}">{{ label|default:f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<p class="help">{{ f.help_text }}</p>{% endif %}
  {% for e in f.errors %}<p class="field-err">{{ e }}</p>{% endfor %}
</div>
